[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-ailayer"
version = "0.1.0"
description = "An AI-powered assistant that automates Windows desktop tasks using natural language"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Cosmic Hydra", email = "cosmic-hydra@users.noreply.github.com"}
]
keywords = ["ai", "automation", "windows", "assistant", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "setuptools",
    "pywinauto",
    "pyautogui",
    "pygetwindow",
    "customtkinter",
    "openai",
    "Pillow",
    "SpeechRecognition",
    "requests",
    "pywin32",
    "psutil",
    "fuzzywuzzy",
    "pytesseract",
    "uiautomation",
    "gTTS",
    "pygame",
    "pyaudio",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "bandit>=1.7.5",
]

[project.scripts]
singularity-ai = "core.assistant:main"

[project.urls]
Homepage = "https://github.com/cosmic-hydra/singularity-ailayer"
Repository = "https://github.com/cosmic-hydra/singularity-ailayer"
Issues = "https://github.com/cosmic-hydra/singularity-ailayer/issues"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
