version: "3.8"

services:
  test:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-test-key}
      - LOG_LEVEL=DEBUG
    volumes:
      - ./core:/app/core
      - ./tests:/app/tests
    command: pytest tests/ -v

  lint:
    build: .
    volumes:
      - ./core:/app/core
    command: ruff check .
